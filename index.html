<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickBite — Food & Pabili</title>
<style>
:root{--pink:#d81b60;--pink2:#ff4f8b;--bg:#f7f7f8;--card:#fff;--text:#202124;--muted:#6b7280;--line:#e5e7eb;--green:#16803c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:23px;font-weight:800;color:var(--pink)}.nav-actions{display:flex;gap:8px}.btn.danger{background:#b91c1c;color:#fff;border-color:#b91c1c;}
.btn{padding:10px 15px;border-radius:10px;background:#eee}.btn.primary{background:var(--pink);color:#fff}.btn.dark{background:#222;color:#fff}.container{max-width:1120px;margin:auto;padding:28px 18px}.hero{background:linear-gradient(135deg,#fff 0%,#ffe8f0 100%);border-radius:22px;padding:38px 28px;margin-bottom:25px}.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 8px}.hero p{color:var(--muted);font-size:17px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;text-align:left;transition:.15s}.choice-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px #00000010}.emoji{font-size:38px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.restaurant-img,.dish-img{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#eee}.dish-img{height:130px}.price{font-weight:800}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title{margin:25px 0 12px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.form textarea{min-height:90px;resize:vertical}.hidden{display:none!important}.cart{position:fixed;right:18px;bottom:18px;background:#222;color:#fff;border-radius:50px;padding:13px 18px;box-shadow:0 8px 30px #0004}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#ffe4ee;color:#a4144c;font-size:12px;font-weight:700}.notice{padding:13px;border-radius:12px;background:#eef7ff;border:1px solid #cfe7ff}.success{background:#ecfdf3;border-color:#bbf7d0}.danger{background:#fff1f2;border-color:#fecdd3}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap}.admin-layout{display:grid;grid-template-columns:220px 1fr;gap:20px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;height:max-content}.sidebtn{display:block;width:100%;text-align:left;background:#fff;padding:11px;border-radius:9px;margin-bottom:4px}.sidebtn.active,.sidebtn:hover{background:#ffe8f0;color:#a4144c}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font-size:26px}.order{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.small{font-size:13px}.footer{text-align:center;color:var(--muted);padding:35px}
@media(max-width:700px){.choice{grid-template-columns:1fr}.admin-layout{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}.nav{padding:12px 4%}}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">QuickBite</div>
  <div class="nav-actions">
    <button class="btn" onclick="showHome()">Home</button>
    <button class="btn" onclick="showTrack()">Track Order</button>
    <button class="btn" onclick="showAdmin()">Admin</button>
  </div>
</nav>
<main class="container" id="app"></main>
<div id="cartBtn" class="cart hidden" onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
<footer class="footer">QuickBite • Food Delivery & Pabili</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://fuimbgmdxqxiskwpynjr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_5XaurhIxLqs3P4y7Q0QdKw_6vt77FTx';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let db={restaurants:[],dishes:[],orders:[]};
let cart=[];
let pabiliDraft=null;

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return '₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2});}
function el(html){document.getElementById('app').innerHTML=html;}
function updateCart(){document.getElementById('cartCount').textContent=cart.reduce((s,x)=>s+x.qty,0);document.getElementById('cartBtn').classList.toggle('hidden',cart.length===0);}

async function loadCatalog(){
 const [{data:restaurants,error:e1},{data:dishes,error:e2}]=await Promise.all([
  sb.from('restaurants').select('*').order('created_at',{ascending:false}),
  sb.from('dishes').select('*').order('created_at',{ascending:false})
 ]);
 if(e1||e2){console.error(e1||e2);return alert('Could not load restaurants/dishes. Please check your Supabase schema and RLS.');}
 db.restaurants=restaurants||[]; db.dishes=dishes||[]; updateCart();
}
async function loadAdminOrders(){
 const {data:orders,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});
 if(error){console.error(error);return alert('Could not load orders. Make sure this account is registered in public.admin_users.');}
 db.orders=orders||[];
 const {data:items,error:ie}=await sb.from('order_items').select('*');
 if(!ie){db.orders.forEach(o=>o.items=(items||[]).filter(i=>i.order_id===o.id));}
}
async function init(){await loadCatalog();showHome();}

function showHome(){updateCart();el(`<section class="hero"><h1>Order what you need.</h1><p>Food delivery and Pabili/Grocery in one simple link. No customer account required.</p><div class="choice"><button class="choice-card" onclick="showRestaurants()"><div class="emoji">🍔</div><h2>Order Food</h2><p class="muted">Choose a restaurant and add dishes to your cart.</p></button><button class="choice-card" onclick="showPabili()"><div class="emoji">🛒</div><h2>Pabili / Grocery</h2><p class="muted">Send a shopping list, store preference and optional photo.</p></button></div></section><div class="notice"><b>No account needed.</b> After checkout, you'll receive an order number you can use to track your order.</div>`);}
function showRestaurants(){updateCart();const rs=db.restaurants.filter(r=>r.is_active);el(`<h1>Restaurants</h1><p class="muted">Choose where you want to order.</p><div class="grid">${rs.map(r=>`<div class="card"><img class="restaurant-img" src="${escapeHtml(r.image_url||'')}" onerror="this.style.display='none'"><h3>${escapeHtml(r.name)}</h3><span class="badge">${escapeHtml(r.category||'Food')}</span><p class="muted">${escapeHtml(r.description||'')}</p><button class="btn primary" onclick="showMenu('${r.id}')">View Menu</button></div>`).join('')||'<div class="notice">No restaurants available yet.</div>'}</div>`);}
function showMenu(rid){const r=db.restaurants.find(x=>x.id===rid);if(!r)return showRestaurants();const ds=db.dishes.filter(x=>x.restaurant_id===rid&&x.is_available);el(`<button class="btn" onclick="showRestaurants()">← Restaurants</button><h1>${escapeHtml(r.name)}</h1><p class="muted">${escapeHtml(r.description||'')}</p><div class="grid">${ds.map(d=>`<div class="card"><img class="dish-img" src="${escapeHtml(d.image_url||'')}" onerror="this.style.display='none'"><div class="row"><h3>${escapeHtml(d.name)}</h3><span class="price">${money(d.price)}</span></div><p class="muted">${escapeHtml(d.description||'')}</p><button class="btn primary" onclick="addCart('${d.id}')">+ Add</button></div>`).join('')||'<div class="notice">No available dishes yet.</div>'}</div>`);}
function addCart(did){const d=db.dishes.find(x=>x.id===did);if(!d)return;const x=cart.find(i=>i.dish_id===did);if(x)x.qty++;else cart.push({dish_id:did,qty:1});updateCart();showCart();}
function showCart(){if(!cart.length)return showRestaurants();let subtotal=cart.reduce((s,x)=>{const d=db.dishes.find(d=>d.id===x.dish_id);return s+(d?d.price*x.qty:0)},0);el(`<button class="btn" onclick="showRestaurants()">← Continue Shopping</button><h1>Your Cart</h1>${cart.map((x,i)=>{const d=db.dishes.find(d=>d.id===x.dish_id);return `<div class="order row"><div><b>${escapeHtml(d?.name)}</b><div class="muted">${money(d?.price)} each</div></div><div><button class="btn" onclick="changeQty(${i},-1)">−</button> ${x.qty} <button class="btn" onclick="changeQty(${i},1)">+</button></div><b>${money((d?.price||0)*x.qty)}</b></div>`}).join('')}<div class="card"><div class="row"><b>Subtotal</b><b>${money(subtotal)}</b></div><div class="row"><span>Delivery fee</span><span>${money(50)}</span></div><hr><div class="row"><h3>Total</h3><h3>${money(subtotal+50)}</h3></div><button class="btn primary" onclick="showCheckout('food')">Checkout</button></div>`);}
function changeQty(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);updateCart();showCart();}
function showPabili(){document.getElementById('cartBtn').classList.add('hidden');el(`<button class="btn" onclick="showHome()">← Home</button><h1>🛒 Pabili / Grocery</h1><p class="muted">Tell us what you want us to buy. You don't need an account.</p><div class="card form"><label>Preferred store<input id="pStore" placeholder="e.g. local grocery, Puregold, public market"></label><label>Shopping list<textarea id="pList" placeholder="Example:\n5 kg rice\n12 eggs\n1 bottle cooking oil"></textarea></label><label>Estimated budget (optional)<input id="pBudget" type="number" min="0" placeholder="₱"></label><label>Upload grocery list photo (optional)<input id="pPhoto" type="file" accept="image/*"></label><label>Special instructions<textarea id="pNotes" placeholder="Brand preferences, substitutions, etc."></textarea></label><button class="btn primary" onclick="preparePabili()">Continue to Checkout</button></div>`);}
function preparePabili(){const store=document.getElementById('pStore').value.trim(),list=document.getElementById('pList').value.trim(),budget=Number(document.getElementById('pBudget').value||0),notes=document.getElementById('pNotes').value.trim(),file=document.getElementById('pPhoto').files[0];if(!list)return alert('Please enter your shopping list.');pabiliDraft={store,list,budget,notes,file};showCheckout('pabili');}
function showCheckout(type){const estimated=type==='food'?cart.reduce((s,x)=>{const d=db.dishes.find(d=>d.id===x.dish_id);return s+(d?d.price*x.qty:0)},0):(pabiliDraft?.budget||0);el(`<button class="btn" onclick="${type==='food'?'showCart()':'showPabili()'}">← Back</button><h1>Checkout</h1><div class="card form"><label>Full name<input id="cName" placeholder="Juan Dela Cruz"></label><label>Contact number<input id="cPhone" placeholder="09XXXXXXXXX"></label><label>Delivery address<textarea id="cAddress" placeholder="Complete delivery address"></textarea></label><label>Landmark / notes<textarea id="cLandmark" placeholder="Landmark or delivery instructions"></textarea></label><label>Payment<select id="cPay"><option value="cod">Cash on Delivery</option><option value="gcash">GCash (manual confirmation)</option></select></label><div class="notice"><b>${type==='food'?'Food order':'Pabili order'}</b><br>Estimated items: ${money(estimated)}<br>Delivery fee: ${money(50)}${type==='pabili'?'<br><small>Final grocery cost may change after shopping.</small>':''}</div><button class="btn primary" onclick="placeOrder('${type}')">Place Order</button></div>`);}
async function uploadPabiliPhoto(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('pabili').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error){console.error(error);alert('Photo upload failed; the order will continue without the photo.');return null;}return path;}
async function placeOrder(type){const name=document.getElementById('cName').value.trim(),phone=document.getElementById('cPhone').value.trim(),address=document.getElementById('cAddress').value.trim();if(!name||!phone||!address)return alert('Please complete your name, contact number and delivery address.');const orderNumber='QB-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(Date.now()).slice(-6);let subtotal=type==='food'?cart.reduce((s,x)=>{const d=db.dishes.find(d=>d.id===x.dish_id);return s+(d?d.price*x.qty:0)},0):(pabiliDraft?.budget||0);let photoPath=null;if(type==='pabili'&&pabiliDraft?.file)photoPath=await uploadPabiliPhoto(pabiliDraft.file);const {data:o,error}=await sb.from('orders').insert({order_number:orderNumber,order_type:type,customer_name:name,customer_phone:phone,delivery_address:address,landmark:document.getElementById('cLandmark').value,notes:type==='pabili'?(pabiliDraft?.notes||''):'',subtotal,service_fee:type==='pabili'?50:0,delivery_fee:50,total:subtotal+50+(type==='pabili'?50:0),payment_method:document.getElementById('cPay').value,payment_status:'pending',order_status:'pending',pabili_store:type==='pabili'?(pabiliDraft?.store||null):null,pabili_list:type==='pabili'?(pabiliDraft?.list||null):null,pabili_budget:type==='pabili'?(pabiliDraft?.budget||null):null,pabili_photo_url:photoPath}).select().single();if(error){console.error(error);return alert('Order could not be submitted: '+error.message);}if(type==='food'){const rows=cart.map(x=>{const d=db.dishes.find(d=>d.id===x.dish_id);return {order_id:o.id,dish_id:d.id,dish_name:d.name,quantity:x.qty,unit_price:d.price};});const {error:ie}=await sb.from('order_items').insert(rows);if(ie){console.error(ie);return alert('Order was created but its items could not be saved: '+ie.message);}}if(type==='pabili'){const items=pabiliDraft.list.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(line=>({order_id:o.id,item_name:line,quantity_text:null,preferred_brand:null,notes:pabiliDraft.notes||null}));if(items.length)await sb.from('pabili_items').insert(items);}cart=[];pabiliDraft=null;updateCart();showConfirmation(o);}
function showConfirmation(o){el(`<div class="hero"><h1>🎉 Order received!</h1><p>Your order has been submitted.</p><div class="card"><h2>${escapeHtml(o.order_number)}</h2><p>Status: <span class="badge">Pending</span></p><button class="btn primary" onclick="showTrack('${escapeHtml(o.order_number)}')">Track Order</button></div></div>`);}
async function showTrack(prefill=''){el(`<h1>📦 Track Order</h1><div class="card form"><label>Order number<input id="trackNo" value="${escapeHtml(prefill)}" placeholder="QB-20260912-0001"></label><button class="btn primary" onclick="track()">Track</button></div><div id="trackResult"></div>`);if(prefill)track();}
async function track(){const n=document.getElementById('trackNo').value.trim();if(!n)return;const {data,error}=await sb.rpc('track_order',{p_order_number:n});const r=document.getElementById('trackResult');if(error){console.error(error);r.innerHTML='<div class="notice danger">Could not check order status.</div>';return;}const o=data?.[0];if(!o){r.innerHTML='<div class="notice danger">Order not found.</div>';return;}const steps=[['pending','Pending'],['confirmed','Confirmed'],['preparing','Preparing / Shopping'],['ready','Ready for Pickup'],['out_for_delivery','Out for Delivery'],['delivered','Delivered']];let idx=steps.findIndex(s=>s[0]===o.order_status);if(idx<0)idx=0;r.innerHTML=`<div class="card"><h2>${escapeHtml(o.order_number)}</h2><p><b>${o.order_type==='food'?'🍔 Food':'🛒 Pabili'}</b></p><p>Status: <span class="badge">${escapeHtml(o.order_status)}</span></p>${steps.map((s,i)=>`<div style="padding:9px;border-left:4px solid ${i<=idx?'#d81b60':'#ddd'};margin:5px 0">${i<=idx?'✓':'○'} ${s[1]}</div>`).join('')}<hr><p>Total/estimate: <b>${money(o.total)}</b></p></div>`;}

async function showAdmin(){const {data:{session}}=await sb.auth.getSession();if(!session){el(`<div class="card form" style="max-width:480px;margin:auto"><h1>🔐 Admin Login</h1><p class="muted">Admin access only.</p><label>Email<input id="aEmail" type="email" placeholder="admin@email.com"></label><label>Password<input id="aPassword" type="password" placeholder="Password"></label><button class="btn primary" onclick="adminLogin()">Login</button><button class="btn" onclick="showHome()">← Back</button></div>`);return;}const {data:isAdmin,error}=await sb.rpc('is_admin');if(error||!isAdmin){await sb.auth.signOut();return alert('This account is not registered as a QuickBite admin.');}await loadAdminOrders();adminDashboard('orders');}
async function adminLogin(){const email=document.getElementById('aEmail').value.trim(),password=document.getElementById('aPassword').value;if(!email||!password)return alert('Enter email and password.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return alert('Login failed: '+error.message);await showAdmin();}
async function adminLogout(){await sb.auth.signOut();showHome();}
function adminDashboard(section){document.getElementById('cartBtn').classList.add('hidden');let content=section==='orders'?adminOrders():section==='restaurants'?adminRestaurants():adminDishes();el(`<div class="admin-layout"><aside class="sidebar"><h3>👑 Admin</h3><button class="sidebtn ${section==='orders'?'active':''}" onclick="adminDashboard('orders')">📋 Orders</button><button class="sidebtn ${section==='restaurants'?'active':''}" onclick="adminDashboard('restaurants')">🏪 Restaurants</button><button class="sidebtn ${section==='dishes'?'active':''}" onclick="adminDashboard('dishes')">🍔 Dishes</button><button class="sidebtn" onclick="adminLogout()">🚪 Logout</button><button class="sidebtn" onclick="showHome()">↩ Customer Site</button></aside><section><h1>Dashboard</h1>${content}</section></div>`);}
function adminOrders(){const all=db.orders;return `<div class="statgrid"><div class="stat">Orders<br><b>${all.length}</b></div><div class="stat">Pending<br><b>${all.filter(o=>o.order_status==='pending').length}</b></div><div class="stat">Pabili<br><b>${all.filter(o=>o.order_type==='pabili').length}</b></div><div class="stat">Sales<br><b>${money(all.reduce((s,o)=>s+Number(o.total||0),0))}</b></div></div><h2>All Orders</h2>${all.length?all.map(o=>`<div class="order"><div class="row"><div><b>${escapeHtml(o.order_number)}</b><div class="small muted">${new Date(o.created_at).toLocaleString()}</div></div><span class="badge">${escapeHtml(o.order_type)}</span></div><p><b>${escapeHtml(o.customer_name)}</b> • ${escapeHtml(o.customer_phone)}<br>${escapeHtml(o.delivery_address)}${o.landmark?'<br>'+escapeHtml(o.landmark):''}</p>${o.order_type==='food'?`<p>${(o.items||[]).map(i=>`${i.quantity}× ${escapeHtml(i.dish_name)}`).join(', ')}</p>`:`<p><b>Store:</b> ${escapeHtml(o.pabili_store||'—')}<br><b>List:</b><br>${escapeHtml(o.pabili_list||'').replaceAll('\n','<br>')}</p>`}<div class="row"><b>${money(o.total)}</b><div><select onchange="setStatus('${o.id}',this.value)">${['Pending','Confirmed','Preparing / Shopping','Ready for Pickup','Out for Delivery','Delivered','Cancelled'].map(s=>`<option value="${s}" ${o.order_status===({'Pending':'pending','Confirmed':'confirmed','Preparing / Shopping':'preparing','Ready for Pickup':'ready','Out for Delivery':'out_for_delivery','Delivered':'delivered','Cancelled':'cancelled'}[s])?'selected':''}>${s}</option>`).join('')}</select><button class="btn danger" onclick="deleteOrder('${o.id}','${escapeHtml(o.order_number)}')">Delete Order</button></div></div>`).join(''):'<div class="notice">No orders yet.</div>'}`;}
async function deleteOrder(id,orderNumber){if(!confirm('Delete test/order '+orderNumber+'? This cannot be undone.'))return;const {error}=await sb.from('orders').delete().eq('id',id);if(error)return alert(error.message);await loadAdminOrders();adminDashboard('orders');}
async function setStatus(id,status){const map={'Pending':'pending','Confirmed':'confirmed','Preparing / Shopping':'preparing','Ready for Pickup':'ready','Out for Delivery':'out_for_delivery','Delivered':'delivered','Cancelled':'cancelled'};const s=map[status];const {error}=await sb.from('orders').update({order_status:s,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('Could not update order status: '+error.message);await sb.from('order_status_history').insert({order_id:id,status:s});await loadAdminOrders();adminDashboard('orders');}
function adminRestaurants(){return `<div class="card form"><h2>Add Restaurant</h2><input id="rn" placeholder="Restaurant name"><input id="rc" placeholder="Category"><input id="rd" placeholder="Description"><input id="ri" placeholder="Image URL (optional)"><button class="btn primary" onclick="addRestaurant()">Save Restaurant</button></div><h2>Restaurants</h2>${db.restaurants.map(r=>`<div class="order row"><div><b>${escapeHtml(r.name)}</b><div class="muted">${escapeHtml(r.category||'')}</div></div><div><button class="btn" onclick="toggleRestaurant('${r.id}')">${r.is_active?'Disable':'Enable'}</button><button class="btn" onclick="deleteRestaurant('${r.id}')">Delete</button></div></div>`).join('')||'<div class="notice">No restaurants.</div>'}`;}
async function addRestaurant(){const name=document.getElementById('rn').value.trim();if(!name)return alert('Restaurant name required.');const {error}=await sb.from('restaurants').insert({name,category:document.getElementById('rc').value.trim()||'Food',description:document.getElementById('rd').value.trim(),image_url:document.getElementById('ri').value.trim()||null,is_active:true});if(error)return alert(error.message);await loadCatalog();adminDashboard('restaurants');}
async function toggleRestaurant(id){const r=db.restaurants.find(x=>x.id===id);if(!r)return;const {error}=await sb.from('restaurants').update({is_active:!r.is_active}).eq('id',id);if(error)return alert(error.message);await loadCatalog();adminDashboard('restaurants');}
async function deleteRestaurant(id){if(!confirm('Delete restaurant and its dishes?'))return;const {error}=await sb.from('restaurants').delete().eq('id',id);if(error)return alert(error.message);await loadCatalog();adminDashboard('restaurants');}
function adminDishes(){return `<div class="card form"><h2>Add Dish</h2><select id="dr">${db.restaurants.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')}</select><input id="dn" placeholder="Dish name"><input id="dp" type="number" min="0" step="0.01" placeholder="Price"><input id="dd" placeholder="Description"><input id="di" placeholder="Image URL (optional)"><button class="btn primary" onclick="addDish()">Save Dish</button></div><h2>Menu</h2>${db.dishes.map(d=>{const r=db.restaurants.find(r=>r.id===d.restaurant_id);return `<div class="order row"><div><b>${escapeHtml(d.name)}</b><div class="muted">${escapeHtml(r?.name||'Unknown')} • ${money(d.price)}</div></div><button class="btn" onclick="toggleDish('${d.id}')">${d.is_available?'Disable':'Enable'}</button></div>`}).join('')||'<div class="notice">No dishes.</div>'}`;}
async function addDish(){const name=document.getElementById('dn').value.trim(),price=Number(document.getElementById('dp').value),restaurant_id=document.getElementById('dr').value;if(!name||Number.isNaN(price))return alert('Dish name and price required.');const {error}=await sb.from('dishes').insert({restaurant_id,name,price,description:document.getElementById('dd').value.trim(),image_url:document.getElementById('di').value.trim()||null,is_available:true});if(error)return alert(error.message);await loadCatalog();adminDashboard('dishes');}
async function toggleDish(id){const d=db.dishes.find(x=>x.id===id);if(!d)return;const {error}=await sb.from('dishes').update({is_available:!d.is_available}).eq('id',id);if(error)return alert(error.message);await loadCatalog();adminDashboard('dishes');}

init();
</script>
</body>
</html>
